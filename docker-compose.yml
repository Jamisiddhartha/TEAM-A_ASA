version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: asa-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Team2026
      POSTGRES_DB: asadb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data:
